# CI = the same tools/gate.sh that runs locally, in strict mode: a skipped
# check on a runner is a provisioning bug, not an acceptable gap (D-024).
# Actions are pinned by commit SHA (supply-chain posture, INV-7); tool versions
# mirror the local environment — bump them together, deliberately.
name: gate

on:
  push:
    branches: [main]
  # PRs run the gate too. Without this the checks fired only AFTER merge, while
  # CONTRIBUTING.md promised "the same checks locally and in CI" and carried a full
  # Pull requests section — so a dependency-adding PR could land before `cargo deny`
  # (INV-7's actual enforcement point) had ever seen it. Cost, stated: a PR from a
  # FORK gets no access to this repo's cache, so those runs are cold against the
  # 120-minute budget below; same-repo branch PRs hit the cache normally.
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Advisory tripwire: cargo-deny pulls a fresh RustSec DB each run, so a
    # quiet repo still learns about a new CVE within days (P0.5).
    #
    # Twice weekly, not weekly — and the second reason matters as much as the
    # first. GitHub evicts a cache untouched for 7 days, so a weekly cadence
    # sat exactly ON the eviction boundary: one late run and the caches were
    # gone. Mon+Thu keeps every gap ≤4 days, so the cache never expires from
    # quiet alone (2026-07-30: that boundary is what went red).
    - cron: "23 6 * * 1,4" # Mon+Thu 06:23 UTC — off the top-of-hour spike


permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # Pinned image, not ubuntu-latest: the -latest label migrates underneath
    # you (24.04 today; 26.04 images already published).
    runs-on: ubuntu-24.04
    # Cold cache compiles the rusty-kaspa tree three times (clippy, test,
    # arm64) plus three tool installs; warm runs are a fraction of this.
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      # A cold runner builds the whole pinned rusty-kaspa tree three times
      # (clippy --all-targets, test, arm64 cross). Debug info is the bulk of
      # that on disk, and incremental state is dead weight on a machine that
      # is destroyed after one job. Both off. This changes what the build
      # WRITES, never what the gate CHECKS (2026-07-30 CI-cold diagnosis).
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Reclaim runner disk
        # The image ships several toolchains this gate never touches. On a
        # warm cache their bulk is harmless; on a COLD one the build needs
        # every gigabyte. Android stays — the arm64 cross-compile needs the
        # NDK the image provides.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/.ghcup \
            /opt/ghc /usr/local/share/powershell \
            /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -h /

      - name: Install pinned Rust toolchain
        # Mirrors rust/rust-toolchain.toml — the runner ships a newer stable
        # without clippy, and `clippy -D warnings` must not drift with it.
        run: |
          rustup toolchain install 1.94.0 --profile minimal \
            --component rustfmt --component clippy \
            --target aarch64-linux-android
          rustup default 1.94.0

      # Restore and save are SPLIT deliberately. The combined `actions/cache`
      # only saves in a post-step that GitHub skips when the job fails — so a
      # red run left the caches empty, the next run started cold, and cold is
      # what breaks the build: red became self-sustaining (runs 79→81, all on
      # unchanged dependencies). Saving on `always()` breaks that loop; the
      # run after a failure is warm and the failure becomes reproducible.
      - name: Restore gate tools
        id: tools-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/ci-tools
          key: ci-tools-${{ runner.os }}-deny0.19.8-ndk4.1.2-frb2.12.0

      - name: Restore cargo registry + build artifacts
        id: rust-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: rust-${{ runner.os }}-1.94.0-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-1.94.0-

      - name: Install gate tools (compiled once, then cache-hit)
        run: |
          echo "$HOME/ci-tools/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/ci-tools/bin:$PATH"
          command -v cargo-deny >/dev/null || \
            cargo install cargo-deny --version 0.19.8 --locked --root "$HOME/ci-tools"
          command -v cargo-ndk >/dev/null || \
            cargo install cargo-ndk --version 4.1.2 --locked --root "$HOME/ci-tools"
          command -v flutter_rust_bridge_codegen >/dev/null || \
            cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked --root "$HOME/ci-tools"

      - name: Set up Flutter (pinned — codegen-drift check needs this exact version)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.41.5
          cache: true

      - run: flutter pub get

      - name: Run the gate (strict — every check provisioned or red)
        # ANDROID_NDK_HOME is preset on the runner image; the gate uses it for
        # the arm64 cross-compile check.
        run: |
          set -o pipefail
          GATE_STRICT=1 tools/gate.sh 2>&1 | tee /tmp/gate.log

      - name: Name the failing checks in an ANNOTATION
        if: failure()
        # Job logs need admin rights on this repo; ANNOTATIONS do not — they
        # come back from the public check-runs API. A red gate that only
        # whispers into a log nobody can open costs a session per diagnosis
        # (2026-07-30: three runs red, cause inferred rather than read). The
        # gate already prints a per-check verdict — this republishes it where
        # it can actually be seen.
        run: |
          grep -E '^(FAIL|SKIP)' /tmp/gate.log | while IFS= read -r line; do
            echo "::error title=gate::${line}"
          done
          # Workflow-command escaping: % first, then newlines (order matters).
          tail_msg=$(tail -30 /tmp/gate.log \
            | sed -e 's/%/%25/g' -e 's/\r//g' \
            | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g')
          echo "::error title=gate-tail::${tail_msg}"

      # Everything below runs on failure too — that is the point.
      - name: Report runner resources
        if: always()
        # A build that dies mid-compile looks identical to a build that lost a
        # lint, unless the machine says which. Cheap, and it makes the NEXT red
        # run legible instead of a guess.
        run: |
          echo "── disk"; df -h /
          echo "── rust/target"; du -sh rust/target 2>/dev/null || true
          echo "── memory"; free -h
          echo "── OOM kills (empty = none)"
          sudo dmesg 2>/dev/null | grep -i -E 'killed process|out of memory' || true

      - name: Save gate tools
        if: always() && steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/ci-tools
          key: ci-tools-${{ runner.os }}-deny0.19.8-ndk4.1.2-frb2.12.0

      - name: Save cargo registry + build artifacts
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: rust-${{ runner.os }}-1.94.0-${{ hashFiles('rust/Cargo.lock') }}
