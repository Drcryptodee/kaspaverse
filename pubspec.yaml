name: kaspaverse
description: "KaspaVerse — Android-first Kaspa wallet kernel + covenant arcade."
publish_to: 'none'

version: 0.2.0+2

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # Rust bridge (FRB v2) — runtime + the cargokit builder plugin that compiles
  # rust/bridge during the native build (P0 §0.1).
  flutter_rust_bridge: 2.12.0
  kaspaverse_bridge:
    path: rust_builder

  cupertino_icons: ^1.0.8

  # QR matrix encoder (P1.7) — pure Dart, no native/plugin/FFI, no network
  # (INV-8); only transitive dep is `meta` (already in tree). We render the
  # matrix ourselves with a CustomPainter to own the DS-8 dark-on-light rule
  # (D-045b). Pinned exact (INV-7 supply-chain custody). License: BSD-3.
  qr: 4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # The canonical BIP39 English wordlist (public data; sha256 2f5eed…3b24dbda),
  # bundled for the restore picker's filter ONLY — the secret is the ordered
  # selection, not the dictionary. Never fetched at runtime; validation stays
  # Rust-side (the pinned kaspa_bip32, INV-9).
  assets:
    - assets/bip39/english.txt

  # Bundled type — never runtime-fetched (DS-6/§4). Two faces only (§13):
  # Inter (UI) + JetBrains Mono (every amount/address/hash/score, DS-2).
  # Variable TTFs; weight rides the `wght` axis via FontVariation (kv_theme).
  # OFL-licensed (assets/fonts/OFL-*.txt); fetched at build time, committed.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
