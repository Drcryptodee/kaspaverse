name: kaspaverse
description: "KaspaVerse — Android-first Kaspa wallet kernel + covenant arcade."
publish_to: 'none'

version: 0.2.0+2

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # Rust bridge (FRB v2) — runtime + the cargokit builder plugin that compiles
  # rust/bridge during the native build (P0 §0.1).
  flutter_rust_bridge: 2.12.0
  kaspaverse_bridge:
    path: rust_builder

  cupertino_icons: ^1.0.8

  # QR matrix encoder (P1.7) — pure Dart, no native/plugin/FFI, no network
  # (INV-8); only transitive dep is `meta` (already in tree). We render the
  # matrix ourselves with a CustomPainter to own the DS-8 dark-on-light rule
  # (D-045b). Pinned exact (INV-7 supply-chain custody). License: BSD-3.
  qr: 4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Perf harness (pre-P3 hardening V0) — both first-party SDK packages,
  # dev-only: never compiled into the release APK. integration_test drives
  # the four baseline surfaces on the reference device; flutter_driver is
  # the host side that receives traceAction timelines and writes summaries.
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter

flutter:
  uses-material-design: true

  # The canonical BIP39 English wordlist (public data; sha256 2f5eed…3b24dbda),
  # bundled for the restore picker's filter ONLY — the secret is the ordered
  # selection, not the dictionary. Never fetched at runtime; validation stays
  # Rust-side (the pinned kaspa_bip32, INV-9).
  assets:
    - assets/bip39/english.txt

  # Bundled type — never runtime-fetched (BG-16). **Two faces, never three**
  # (BG-30): Plus Jakarta Sans SPEAKS, JetBrains Mono COUNTS, and they never
  # trade jobs. Variable TTFs; every weight rides the `wght` axis via
  # `FontVariation`, never `FontWeight` (L150 — on a variable face the enum is a
  # hint and the axis is the ink). OFL-licensed (assets/fonts/OFL-*.txt),
  # committed rather than fetched at build time.
  #
  # **Inter was REMOVED at UX-R0 (D-252, §2).** Deep V6 replaced it and nothing
  # referenced it afterwards; an unused face in the bundle is 877 KB of APK and
  # a third face waiting to be picked up by accident (§8).
  #
  # Provenance, verified 2026-09-03 before it entered the tree: Plus Jakarta
  # Sans by Tokotype, OFL 1.1, fetched from google/fonts AND from the designer's
  # own repo (tokotype/PlusJakartaSans) and the two are **byte-identical** —
  # sha256 89b3fb38aa0d275d7a731d0d817a4f1622b316b4d7fbdedcf02ee9099ff68bc8.
  # `fvar`: one axis, `wght` 200–800, default 400, which covers §2's 400–800.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
