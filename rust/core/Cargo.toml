# Handshake JSON build/parse (P2.3 §0.7) — direct lines on packages already
# locked in the tree via the pinned kaspa crates (the D-065/D-063 pattern:
# zero new packages; serde_json moved up from dev-deps where P2.2 already
# used it for the parity fixtures).
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
