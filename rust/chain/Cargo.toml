[package]
name = "kaspaverse-chain"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kaspa-wrpc-client.workspace = true
kaspa-consensus-core.workspace = true
kaspa-addresses.workspace = true
# P2.1 transport scan: output-script → address via the pin's standard decoder
# (INV-9). Same-pin crate, already in the lock transitively.
kaspa-txscript.workspace = true
# Wallet UTXO sync (P1.5 §0.8 / D-005): UtxoProcessor/UtxoContext + the Events
# stream + TransactionRecord (its own borsh codec). INV-9 authority — consumed,
# never re-implemented. The wallet-core dep lives HERE (not the bridge), so the
# secret-free chain layer is what touches the wallet framework, never the FFI.
kaspa-wallet-core.workspace = true
# Activity store: persist wallet-core TransactionRecords with the pin's own
# borsh codec (derive for our framing enum). Already in the lock (1.6.1).
borsh = { version = "1", features = ["derive"] }
tokio.workspace = true
async-channel.workspace = true
log.workspace = true
# V2b history fill (D-074): the indexer client rides the resolver's own HTTP
# crate from the pinned tree (pinned-crates-first); serde/serde_json parse its
# JSON responses. All already in the lock — see the workspace manifest note.
workflow-http.workspace = true
serde = { workspace = true }
serde_json.workspace = true
# V6 probe hardening: `api::ops::RPC_API_VERSION` for the wrong-RPC-major
# refusal in link::probe_endpoint (wallet-core's own handshake gate is the
# precedent — processor.rs:504-515 at the pin). Same pin, zero new packages.
kaspa-rpc-core.workspace = true

[dev-dependencies]
# Reconnect-survival regression harness (V6, guards D-083/L59/PB-022): the
# test fake implements the pin's #[async_trait] RpcApi. Never ships.
async-trait.workspace = true
