[package]
name = "kaspaverse_bridge"
version = "0.1.0"
edition = "2021"
license.workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
kaspaverse-core = { version = "0.1.0", path = "../core" }
kaspaverse-chain = { version = "0.1.0", path = "../chain" }
tokio.workspace = true
log.workspace = true
workflow-log.workspace = true
zeroize.workspace = true

# JNI seed lane (P1 §0.4, D-033). Path-A seed plaintext crosses Kotlin → Rust
# (and the generated seed crosses Rust → Kotlin's Keystore Cipher at enroll) via
# a direct JNI call into the same `.so` — never FRB, never Dart. Android-only:
# the host build and `cargo test` never link a JVM, so all seed-handling LOGIC
# lives in host-testable safe code (`api::vault`) and this crate only marshals
# bytes across the boundary. `default-features = false` drops the `invocation`
# JVM-launch surface we must never carry. Chosen over `jni-sys`: a binding is
# needed regardless (no in-tree one), and `jni`'s audited array+exception
# handling keeps the correctness-critical unsafe off our hand-written seed path
# (INV-2 — a Rust error becomes a thrown Java exception, never a panic across
# the boundary). dependency-steward audits at name+version (L27); ffi-leak owns
# the seed path.
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21.1", default-features = false }
# L40 closed for good (hardening V1, findings-register item 6 — the ratified
# fallback): profile/release builds silently drop BOTH the workflow-log lane
# AND Flutter's Dart print lane (proven live, 2026-07-09 V1 sitting), so our
# `log` facade sinks straight into Android's liblog via android_logger —
# reaches logcat on every build flavor. Android-only (host builds/tests keep
# the workflow-log forwarder); the unsafe liblog binding stays inside the
# audited crate, never hand-written here. INV-3 unchanged: this is a SINK —
# the no-secrets discipline lives at the call sites (wallet-security PASS
# enumerated every V1 line). dependency-steward audits at name+version.
android_logger = { version = "0.15", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
