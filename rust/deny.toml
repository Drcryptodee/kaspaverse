# cargo-deny baseline — P0.4, D-024. INV-7: every dependency is vetted & ledgered;
# this file is the machine-enforced half of that law. `tools/gate.sh` runs
# `cargo deny check` on every gate; CI runs it strict.
#
# Schema: cargo-deny 0.19.x (pinned in CI; keep local install in sync).
# Any new license, advisory ignore, or source added here needs a DECISION_LOG
# entry — same bar as the dependency that drags it in.

[graph]
# Only platforms we actually build: dev/CI host + the Android device target
# (arm64-only, D-022). Keeps every check scoped to code that can ship.
targets = ["x86_64-unknown-linux-gnu", "aarch64-linux-android"]

[advisories]
# Vulnerabilities are errors by default (cargo-deny ≥0.14) — for the WHOLE tree,
# transitive included; a CVE landing in the pinned tree SHOULD turn the gate red.
# Baseline ignores: none. An ignore entry requires a D-entry with its repayment
# trigger.
#
# unmaintained = "workspace": only OUR direct deps must be actively maintained.
# The pinned rusty-kaspa tree carries 7 unmaintained transitive crates
# (async-std, atty, bincode, derivative, instant, paste, proc-macro-error —
# RUSTSEC, re-reviewed at the v2.1.0 re-pin 2026-09-24, D-324: the SAME seven at
# `cfafeb4c` and `01b532e`, so the bump neither added nor cured one) that we
# cannot fix without breaking the pin (INV-9). Upstream hygiene is reviewed at
# every re-pin instead: run `cargo deny check advisories` with `unmaintained =
# "all"` in a scratch copy of this file, after editing the rev.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# Explicit SPDX allow-list — anything not listed is denied. Derived from the
# actual tree at the rusty-kaspa pin (v2.0.1 `cfafeb4c`; re-verified unchanged at the
# v2.1.0 re-pin `01b532e`, D-324 — `licenses ok`, zero new packages), itself ISC. The list
# also has to cover THIS workspace's own crates — cargo-deny reads them like any
# other — and they are ISC too (D-298, superseding the MIT of D-011).
allow = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    # webpki-roots (Mozilla CA-certificate data via rustls) — data license,
    # permissive, attribution-style. Needed for wRPC TLS.
    "CDLA-Permissive-2.0",
    # Public-domain equivalents (0BSD: mock_instant; CC0: secp256k1).
    "0BSD",
    "CC0-1.0",
    # xxhash-rust (via kaspa-wallet-core, P1.1 / D-030) — Boost Software
    # License: permissive, OSI-approved, no attribution required in binaries.
    "BSL-1.0",
]
confidence-threshold = 0.8
# Note (P1.1): slugify-rs 0.0.3 (via kaspa-wallet-core storage) omits the
# manifest `license` field; cargo-deny detects its MIT LICENSE file directly
# (same situation as allo-isolate). Warning is informational.

# Scoped per-crate exceptions — weaker-copyleft licenses allowed ONLY for the
# named crates, so nothing else can ride in under them unnoticed.
[[licenses.exceptions]]
# kaspa-math (consensus difficulty/Uint arithmetic) → malachite bignum, LGPL-3.0.
# Statically linked, but the app is ISC open-source: the LGPL's modify-and-relink
# freedom is preserved by the public source itself. Unavoidable at the v2.0.1 pin
# (D-024) and still at v2.1.0 (re-pin review 2026-09-24, D-324: `kaspa-math` still
# pulls malachite 0.9.1). Revisit at re-pin or before any non-open distribution.
allow = ["LGPL-3.0-only"]
name = "malachite-base"

[[licenses.exceptions]]
allow = ["LGPL-3.0-only"]
name = "malachite-nz"

[[licenses.exceptions]]
# dirs-sys → option-ext, MPL-2.0 (file-level copyleft, used unmodified).
allow = ["MPL-2.0"]
name = "option-ext"

[bans]
# The rusty-kaspa tree carries duplicate minor versions of common crates —
# deny would be permanent noise at this pin. Revisit at the next re-pin.
# Re-pin review 2026-09-24 (v2.1.0, D-324): 22 duplicate-version warnings at
# `cfafeb4c` and 22 at `01b532e` — the bump added none, so "warn" stands.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The ONE allowed git source: the pinned consensus implementation (INV-9).
allow-git = ["https://github.com/kaspanet/rusty-kaspa.git"]
