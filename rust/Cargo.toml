[workspace]
resolver = "2"
members = ["core", "chain", "bridge", "covenant"]
# The vendored dialer (D-217, see [patch.crates-io] at the foot of this file) is
# deliberately NOT a member. Membership would drag its dev-dependencies into our
# lockfile and put verbatim upstream code — examples included — under
# `clippy --workspace --all-targets -D warnings`, so keeping the tarball byte-exact
# would start costing gate reds. Excluded, it still builds through the patch, and
# its own tests run standalone (`tools/gate.sh` lane "vendored dialer (D-217)").
exclude = ["vendor/tokio-tungstenite"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Profile note (P0 §0.5): TLS/crypto deps must be rustls-based — anything
# OpenSSL-linked breaks the Android cross-compile (lesson L16). Verified at the
# original pin and re-held at the v2.0.1 bump (D-058): rusty-kaspa pins
# workflow-rpc with default-features = false + rustls-tls-webpki-roots, so the
# wRPC stack is OpenSSL-free.

[workspace.dependencies]
# rusty-kaspa pinned at tag v2.0.1 (INV-9: consensus logic only from these).
# Pinned by rev — immutable, unlike tags; rev verified = tag v2.0.1 on 2026-07-03
# (D-058 bump from v2.0.0/`90dbf07`, D-021 — zero consensus deltas proven).
# `version` alongside the rev: cargo asserts the pinned commit resolves to a
# compatible 2.x (the immutable rev fixes which one), and cargo-deny's wildcard
# ban stays at "deny" (a version-less dep reads as "*"). L23.
kaspa-wrpc-client = { version = "2.0.0", git = "https://github.com/kaspanet/rusty-kaspa.git", rev = "cfafeb4c093fa37a303f1b9f19c58f986b870ce3" }
kaspa-consensus-core = { version = "2.0.0", git = "https://github.com/kaspanet/rusty-kaspa.git", rev = "cfafeb4c093fa37a303f1b9f19c58f986b870ce3" }
kaspa-addresses = { version = "2.0.0", git = "https://github.com/kaspanet/rusty-kaspa.git", rev = "cfafeb4c093fa37a303f1b9f19c58f986b870ce3" }
# Wallet layer (P1 §0.1, executes D-005): processor/generator/keys ONLY — the
# upstream `Wallet` account/storage framework is deliberately not used (its
# file-wallet custody conflicts with our INV-4 platform vault).
kaspa-wallet-core = { version = "2.0.0", git = "https://github.com/kaspanet/rusty-kaspa.git", rev = "cfafeb4c093fa37a303f1b9f19c58f986b870ce3" }
kaspa-wallet-keys = { version = "2.0.0", git = "https://github.com/kaspanet/rusty-kaspa.git", rev = "cfafeb4c093fa37a303f1b9f19c58f986b870ce3" }
kaspa-bip32 = { version = "2.0.0", git = "https://github.com/kaspanet/rusty-kaspa.git", rev = "cfafeb4c093fa37a303f1b9f19c58f986b870ce3" }
# Standard-script → address decoding for the P2.1 transport scan
# (`extract_script_pub_key_address` — INV-9 authority, never re-implemented).
# Same pin, already resolved in the lock via consensus/wallet-core — a direct
# line on an existing transitive adds zero new code (the D-028 §0.2 pattern).
kaspa-txscript = { version = "2.0.0", git = "https://github.com/kaspanet/rusty-kaspa.git", rev = "cfafeb4c093fa37a303f1b9f19c58f986b870ce3" }
# RPC model/API layer (V6, D-073 hardening close): `api::ops::RPC_API_VERSION`
# for the probe's wrong-major refusal (the crate root does not re-export it)
# and the `RpcApi` trait surface for the reconnect-survival test fake. Same
# pin, already resolved in the lock via kaspa-wrpc-client — a direct line on
# an existing transitive adds zero new code (the D-028 §0.2 pattern).
kaspa-rpc-core = { version = "2.0.0", git = "https://github.com/kaspanet/rusty-kaspa.git", rev = "cfafeb4c093fa37a303f1b9f19c58f986b870ce3" }
# Vault crypto (P1 §0.2 Path B). Same crates the pinned tree's own storage
# AEAD uses; the wallet crates above bring them in regardless. Containment
# caveat (P1.1 audit, D-031): "in the pinned tree" holds at crate-name level —
# a minority of transitives resolve to newer semver-compatible versions than
# the pin's own lock (registry checksums + cargo-deny cover them).
# argon2's `zeroize` feature is REQUIRED (D-031): without it the KDF's ~64 MiB
# of passphrase-derived working memory is freed un-wiped — wallet-security
# checklist now verifies this feature on every dep change.
argon2 = { version = "0.5.2", features = ["zeroize"] }
chacha20poly1305 = "0.10.1"
zeroize = { version = "1.6.0", default-features = false, features = ["alloc"] }
# Transport cipher building blocks (P2.2 §0.8, pinned-crates-first): all three
# were ALREADY resolved in the lock as transitives of the pinned tree —
# secp256k1 via the kaspa signing stack (the pin's own feature set includes
# `global-context`, rusty-kaspa Cargo.toml:244), hmac + sha2 via kaspa-bip32's
# BIP32 HMAC. Direct lines at the locked versions add zero new packages (the
# D-063 / D-028 §0.2 containment class). The wire KDF is RFC 5869 HKDF-SHA256
# at its degenerate single-block point (zero salt, empty info, L=32) — two
# HMAC calls, so `hmac` covers it without adding the `hkdf` crate.
secp256k1 = { version = "0.29.1", features = ["global-context"] }
sha2 = "0.10.9"
hmac = "0.12.1"
# Async plumbing — versions chosen to unify with what the pinned rusty-kaspa
# tree already uses (tokio 1.x; async-channel 2.x is what `ChannelConnection`'s
# Sender actually is). FRB's own runtime is also tokio (rust-async default).
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"] }
async-channel = "2"
# Test-only (chain dev-deps): the reconnect-survival fake implements the pin's
# `#[async_trait] RpcApi` trait, which requires the same macro crate the pin
# itself uses. Already resolved in the lock as a transitive of the pinned tree
# (zero new packages); dev-deps never enter the Android build.
async-trait = "0.1"
# Test-only (chain dev-deps), R2 D2: a LOCAL ws server that completes a real
# handshake and then closes — the only way to prove what the pinned ws client
# does after a socket opens and dies, which is the mechanism behind the D-095
# cascade. Deliberately the SAME library the pin's own client speaks
# (`workflow-websocket 0.18` → `tokio-tungstenite 0.23.1`), so the server side
# of the test cannot disagree with the client under test about the protocol.
# Already resolved in the lock as a transitive of the pinned tree (zero new
# packages); dev-deps never enter the Android build. Local-only: INV-8 is
# untouched — nothing in this test leaves the loopback interface.
tokio-tungstenite = "0.23.1"
# Observability: `log::` is the facade our crates emit through. L40 (device,
# 2026-06-15): no sink was ever installed for it — FRB's default utils did NOT
# surface our lines in logcat, while the kaspa crates' own `workflow-log` DOES
# reach logcat. Repaid at the P1.5 re-audit: init_app installs a log→workflow-log
# forwarder. workflow-log is already resolved in the pinned tree (same version,
# zero new transitive code — the D-028 §0.2 pattern).
log = "0.4"
workflow-log = "0.18.0"
# V2b history fill (D-074): the HTTP lane for the ciph_msg indexer client is
# the resolver's OWN client from the pinned tree (workflow-http — resolver.rs:14
# at the pin uses `workflow_http::get_json`), pinned-crates-first per the D-074
# ruling. serde/serde_json carry its response DTOs. All three were ALREADY
# resolved and compiled via the pinned tree (workflow-http 0.18.0 through
# kaspa-wrpc-client; serde everywhere) — direct lines at the locked versions
# add zero new packages (the D-076/D-022a containment class).
# Feature set mirrored VERBATIM from the pin's own declaration (rusty-kaspa
# Cargo.toml:320) — default-features would enable reqwest's native-tls and
# break the Android cross-compile on OpenSSL (L16); the pin rides rustls.
workflow-http = { version = "0.18.0", default-features = false, features = ["rustls-tls-webpki-roots", "http2", "charset", "macos-system-configuration"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Vendored dependency (D-217, INV-7) ──────────────────────────────────────
# `tokio-tungstenite 0.23.1`, the crates.io tarball VERBATIM save for one
# function, redirected here for the whole graph — ours and the pinned tree's
# (`workflow-websocket` → `workflow-rpc` → `kaspa-wrpc-client`), which is the
# point: no call site anywhere has to know.
#
# WHY. `connect.rs`'s `TcpStream::connect("host:port")` walks the resolved
# addresses SERIALLY and advances only on `Err` — and a blackholed SYN is not an
# error inside any timeout a wallet can afford. On the founder's Wi-Fi that cost
# 4 m 34 s to reach a node while the app's own HTTPS egress reached the same
# hostnames in under a second, because hyper-util races the families (its
# `happy_eyeballs_timeout` defaults to 300 ms). The one changed function is that
# race, mirrored from hyper-util's `ConnectingTcp` — which is already compiled
# into this binary.
#
# NOT A PIN MOVE, and not for want of trying: upstream HEAD of BOTH
# `workflow-rs` and `snapview/tokio-tungstenite` still carries the same
# `TcpStream::connect`, measured 2026-08-28. D-183 stays held; there is nothing
# on the other side of it. `workflow-websocket` exposes no connector, dialer or
# stream hook at any version, and `KaspaRpcClient::connect` rebuilds
# `WebSocketConfig` from `Default` every connect — so the socket cannot be
# supplied from the app either.
#
# INV-9 IS UNTOUCHED. This is a dialer, not protocol logic: the wRPC client, the
# handshake, the framing and every consensus type still come from the pinned
# crates, byte-identical. TLS is likewise untouched — the change sits BELOW it,
# and SNI still comes from `domain(&request)`.
#
# PROVENANCE. Extracted from the crates.io `.crate` tarball whose sha256 equals
# the `checksum` cargo recorded for this package in `rust/Cargo.lock`
# (c6989540…631cd). Per-file manifest + the verify command:
# `rust/vendor/PROVENANCE.md`.
#
# DELETION TRIGGER. The day a released `tokio-tungstenite` carries a concurrent
# dial, delete this stanza and `rust/vendor/tokio-tungstenite/`; the build
# returns to the registry crate. That is also the whole reversal.
[patch.crates-io]
tokio-tungstenite = { path = "vendor/tokio-tungstenite" }
