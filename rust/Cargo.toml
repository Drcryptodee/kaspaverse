[workspace]
resolver = "2"
members = ["core", "chain", "bridge"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Profile note (P0 §0.5): TLS/crypto deps must be rustls-based — anything
# OpenSSL-linked breaks the Android cross-compile (lesson L16). Verified at pin
# time: rusty-kaspa v2.0.0 pins workflow-rpc with default-features = false +
# rustls-tls-webpki-roots, so the wRPC stack is OpenSSL-free.

[workspace.dependencies]
# rusty-kaspa pinned at tag v2.0.0 (INV-9: consensus logic only from these).
# Pinned by rev — immutable, unlike tags; rev verified = tag v2.0.0 on 2026-06-12.
# `version` alongside the rev: cargo asserts the pinned commit resolves to a
# compatible 2.x (the immutable rev fixes which one), and cargo-deny's wildcard
# ban stays at "deny" (a version-less dep reads as "*"). L23.
kaspa-wrpc-client = { version = "2.0.0", git = "https://github.com/kaspanet/rusty-kaspa.git", rev = "90dbf074275d60c1fe74a3491883196f110970c0" }
kaspa-consensus-core = { version = "2.0.0", git = "https://github.com/kaspanet/rusty-kaspa.git", rev = "90dbf074275d60c1fe74a3491883196f110970c0" }
kaspa-addresses = { version = "2.0.0", git = "https://github.com/kaspanet/rusty-kaspa.git", rev = "90dbf074275d60c1fe74a3491883196f110970c0" }
# Wallet layer (P1 §0.1, executes D-005): processor/generator/keys ONLY — the
# upstream `Wallet` account/storage framework is deliberately not used (its
# file-wallet custody conflicts with our INV-4 platform vault).
kaspa-wallet-core = { version = "2.0.0", git = "https://github.com/kaspanet/rusty-kaspa.git", rev = "90dbf074275d60c1fe74a3491883196f110970c0" }
kaspa-wallet-keys = { version = "2.0.0", git = "https://github.com/kaspanet/rusty-kaspa.git", rev = "90dbf074275d60c1fe74a3491883196f110970c0" }
kaspa-bip32 = { version = "2.0.0", git = "https://github.com/kaspanet/rusty-kaspa.git", rev = "90dbf074275d60c1fe74a3491883196f110970c0" }
# Vault crypto (P1 §0.2 Path B). Same crates the pinned tree's own storage
# AEAD uses; the wallet crates above bring them in regardless. Containment
# caveat (P1.1 audit, D-031): "in the pinned tree" holds at crate-name level —
# a minority of transitives resolve to newer semver-compatible versions than
# the pin's own lock (registry checksums + cargo-deny cover them).
# argon2's `zeroize` feature is REQUIRED (D-031): without it the KDF's ~64 MiB
# of passphrase-derived working memory is freed un-wiped — wallet-security
# checklist now verifies this feature on every dep change.
argon2 = { version = "0.5.2", features = ["zeroize"] }
chacha20poly1305 = "0.10.1"
zeroize = { version = "1.6.0", default-features = false, features = ["alloc"] }
# Async plumbing — versions chosen to unify with what the pinned rusty-kaspa
# tree already uses (tokio 1.x; async-channel 2.x is what `ChannelConnection`'s
# Sender actually is). FRB's own runtime is also tokio (rust-async default).
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"] }
async-channel = "2"
# Observability: `log::` is the facade our crates emit through. L40 (device,
# 2026-06-15): no sink was ever installed for it — FRB's default utils did NOT
# surface our lines in logcat, while the kaspa crates' own `workflow-log` DOES
# reach logcat. Repaid at the P1.5 re-audit: init_app installs a log→workflow-log
# forwarder. workflow-log is already resolved in the pinned tree (same version,
# zero new transitive code — the D-028 §0.2 pattern).
log = "0.4"
workflow-log = "0.18.0"
